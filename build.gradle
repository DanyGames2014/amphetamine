import net.fabricmc.loom.task.GenerateSourcesTask

plugins {
	id 'maven-publish'
	id 'fabric-loom' version '1.19.3'
	id 'babric-loom-extension' version '1.17.5'
	id "com.modrinth.minotaur" version "2.+"
}

version = property("mod_version")
group = property("maven_group")

base {
	archivesName = project.archives_base_name
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
}

loom {
	if (project.hasProperty("accesswidener_name") && project.accesswidener_name.length() > 0) {
		accessWidenerPath = file("src/main/resources/${project.accesswidener_name}.accesswidener")
	}
}

// Loom's experimental decompile cache chokes on ContainerPlayer's anonymous armor Slot
// (class_277$1): Vineflower emits it as a standalone .java, but CachedJarProcessor expects it
// nested and throws "Unexpected output". The non-cached path handles it, so disable the cache.
// ponytail: costs a full re-decompile each genSources run; drop this once Loom fixes the cache.
tasks.withType(GenerateSourcesTask).configureEach {
	useCache = false
}

repositories {
	// NyaRepo
	maven {
		name = "NyaRepo"
		url = "https://maven.fildand.cz/releases"
	}

	// MeowRepo
	// Mirrors NyaRepo, does not have any geographic restrictions
	maven {
		name = "MeowRepo"
		url = "https://maven.danygames2014.net/releases"
	}

	// Used for Babric Loom and Intermediary
	maven {
		name = "Babric"
		url = "https://maven.glass-launcher.net/babric"
	}

	// Glass Maven Releases
	maven {
		name = "Glass Releases"
		url = "https://maven.glass-launcher.net/releases"
	}

	// Glass Maven Snapshots
	maven {
		name = "Glass Snapshots"
		url = "https://maven.glass-launcher.net/snapshots"
	}

	// Used for a net.jodah.typetools (StationAPI dependency)
	maven {
		name = "Froge Maven"
		url = "https://maven.minecraftforge.net/"
	}

	// Modrinth Maven
	exclusiveContent {
		forRepository {
			//noinspection ForeignDelegate
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	// Maven Central
	mavenCentral()

	// Used for projects that do not have a maven repository, but do have a GitHub repository with working build scripts.
	maven {
		name = "Jitpack"
		url = "https://jitpack.io"
	}

	// Maven Local
	mavenLocal()
}


dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.glasslauncher:biny:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "org.slf4j:slf4j-api:1.8.0-beta4"
	implementation "org.apache.logging.log4j:log4j-slf4j18-impl:2.17.2"
	implementation "me.carleslc:Simple-Yaml:1.8.4"

	modImplementation("net.modificationstation:StationAPI:${project.stapi_version}") {
		exclude group: "babric", module: "fabric-loader"
	}

	if (project.hasProperty("modmenu_version")) {
		modImplementation("net.danygames2014:modmenu:${project.modmenu_version}") {
			transitive = false
		}
	}

	if (project.hasProperty("glass_networking_version")) {
		modImplementation("net.glasslauncher.mods:glass-networking:${project.glass_networking_version}") {
			transitive = false
		}
	}

	if (project.hasProperty("gcapi_version")) {
		modImplementation("net.glasslauncher.mods:GlassConfigAPI:${project.gcapi_version}") {
			transitive = false
		}
	}

	if (project.hasProperty("alwaysmoreitems_version")) {
		modImplementation("net.glasslauncher.mods:AlwaysMoreItems:${project.alwaysmoreitems_version}") {
			transitive = false
		}
	}

	if (project.hasProperty("retrocommands_version")) {
		modImplementation("maven.modrinth:retrocommands:${project.retrocommands_version}-b1.7.3") {
			transitive = false
		}
	}

	if (project.hasProperty("spawneggs_version")) {
		modImplementation("net.danygames2014:spawneggs:${project.spawneggs_version}") {
			transitive = false
		}
	}

	if (project.hasProperty("bhcreative_version")) {
		modImplementation("maven.modrinth:bh-creative:${project.bhcreative_version}-b1.7.3") {
			transitive = false
		}
	}

	if (project.hasProperty("accessoryapi_version")) {
		modImplementation("maven.modrinth:accessory-api:${project.accessoryapi_version}") {
			transitive = false
		}
	}

	if (project.hasProperty("whatsthis_version")) {
		modImplementation("net.danygames2014:WhatsThis:${project.whatsthis_version}") {
			transitive = false
		}
	}

	if (project.hasProperty("nyalib_version")) {
		modImplementation("net.danygames2014:NyaLib:${project.nyalib_version}")
	}

	if (project.hasProperty("uniwrench_version")) {
		modImplementation("net.danygames2014:UniWrench:${project.uniwrench_version}") {
			transitive = false
		}
	}

	// Runtime-Only Mods
	if (project.hasProperty("debugutilities_version")) {
		modRuntimeOnly("net.danygames2014:DebugUtilities:${project.debugutilities_version}")
	}

	if (project.hasProperty("retroauth_version")) {
		modRuntimeOnly("maven.modrinth:retroauth:${project.retroauth_version}-b1.7.3") {
			transitive = false
		}
	}

	if (project.hasProperty("unitweaks_version")) {
		modRuntimeOnly("maven.modrinth:unitweaks:${project.unitweaks_version}-b1.7.3") {
			transitive = false
		}
	}

	modRuntimeOnly("maven.modrinth:fast-stapi-intro:2.0.0-b1.7.3") {
		transitive = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

// Disables the generation of the .module file
tasks.withType(GenerateModuleMetadata).configureEach {
	enabled = false
}

// Gradle 9 fails the build if there are no tests, but we are using the test package for a test mod
tasks.withType(Test).configureEach {
	failOnNoDiscoveredTests = false
}

jar {
	from("LICENSE") {
		rename { "${it}_" + base.archivesName.get() }
	}
}

configurations {
	transitiveImplementation
	modImplementation.extendsFrom transitiveImplementation
}

// Maven Publishing
publishing {
	repositories {
		mavenLocal()

		// Glass Maven
		if (project.hasProperty("calmilamsy_secret_publishing_cave_username")) {
			maven {
				url = "https://maven.glass-launcher.net/releases"
				credentials {
					username = "${project.calmilamsy_secret_publishing_cave_username}"
					password = "${project.calmilamsy_secret_publishing_cave_password}"
				}
			}
		}

		// NyaRepo
		if (project.hasProperty("nyarepo_publishing_cave_username")) {
			maven {
				url = "https://maven.fildand.cz/releases"
				credentials {
					username = "${project.nyarepo_publishing_cave_username}"
					password = "${project.nyarepo_publishing_cave_password}"
				}
			}
		}
	}

	publications {
		create("mavenJava", MavenPublication) {
			//noinspection GrUnresolvedAccess
			artifactId = base.archivesName.get()
			//noinspection GroovyAssignabilityCheck, GrUnresolvedAccess 
			from components.java

			pom.withXml {
				//noinspection GrUnresolvedAccess
				def allowed = configurations.transitiveImplementation.allDependencies.collect { it.name }
				//noinspection GrUnresolvedAccess, GroovyAssignabilityCheck
				asNode().dependencies[0]?.children()?.removeIf { !allowed.contains(it.artifactId.text()) }
			}
		}
	}
}

tasks.register('verifyFrustumIntersection', JavaExec) {
	group = 'verification'
	description = 'Checks the optimized frustum test against the vanilla eight-corner algorithm.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.mine_diver.amphetamine.client.render.FrustumIntersectionVerification'
}

tasks.register('verifyServerChunkCacheMixinPlugin', JavaExec) {
	group = 'verification'
	description = 'Checks that boxed server chunk cache lookups are rewritten to primitive calls.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.mine_diver.amphetamine.mixin.AmphetamineMixinPluginVerification'
}

tasks.register('verifyTerrainQuadCompaction', JavaExec) {
	group = 'verification'
	description = 'Checks that StationAPI quads match the compact terrain vertex format.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.mine_diver.amphetamine.mixin.client.multidraw.TessellatorMixinVerification'
}

tasks.named('check') {
	dependsOn tasks.named('verifyFrustumIntersection'), tasks.named('verifyServerChunkCacheMixinPlugin'), tasks.named('verifyTerrainQuadCompaction')
}
